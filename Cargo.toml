[package]
name = "qdrant-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
dotenvy = "0.15"
fastembed = "4"
qdrant-client = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
image = "0.25"
ndarray = "0.16"
ort = "=2.0.0-rc.5"
openssl = { version = "0.10", features = ["vendored"] }
[profile.dev]
opt-level = 0
debug = false
incremental = true
codegen-units = 256
lto = false

[profile.release]
opt-level = 2
debug = false
codegen-units = 16
lto = false
